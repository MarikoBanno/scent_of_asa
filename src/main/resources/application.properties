spring.application.name=ScentOfASA
spring.profiles.default=h2
spring.config.import=optional:classpath:application-local.properties
server.port=${PORT:8080}
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.flyway.locations=classpath:db/migration
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.currency=${STRIPE_CURRENCY:jpy}
app.slot-bootstrap.enabled=false
app.slot-bootstrap.months-ahead=2
